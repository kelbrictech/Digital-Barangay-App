name: Package Digital Barangay for Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Git metadata and temporary workflow
        run: |
          rm -rf .git
          rm -f .github/workflows/deploy-netlify.yml

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: digital-barangay-netlify-package
          path: .
          include-hidden-files: true
          retention-days: 1
