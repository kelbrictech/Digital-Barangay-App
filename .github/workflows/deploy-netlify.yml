name: Deploy Digital Barangay to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 87417f6b-ba66-40fb-881b-da8f60c1541c
        run: npx --yes netlify-cli@latest deploy --prod --dir . --site "$NETLIFY_SITE_ID"
